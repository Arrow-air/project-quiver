# CAD assembly checks for the build123d package in src/.
# Not Terraform-provisioned — maintained directly in this repository.

name: CAD checks

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "src/**"
      - ".github/workflows/cad_checks.yml"
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/cad_checks.yml"

jobs:
  cad-tests:
    name: Build assembly and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/constraints.txt

      - name: Install quiver package
        run: pip install -e "./src[dev]" -c src/constraints.txt

      - name: Run tests
        run: python -m pytest src/tests/ -q

      - name: Export full assembly (smoke test)
        run: python -m quiver.assembly -o /tmp/quiver_assembly.step
